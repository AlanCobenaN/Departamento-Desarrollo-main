name: Desplegar en GitHub Pages

# Cada push a main recompila el sitio y lo publica. El usuario solo tiene
# que dar push; no hay que tocar nada mas a mano.
on:
  push:
    branches: [main]
  # Permite relanzar el despliegue desde la pestana Actions sin un push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages solo admite un despliegue activo. Sin esto, dos pushes
# seguidos se pelearian por el mismo sitio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preguntar a Pages donde vive el sitio
        id: pages
        uses: actions/configure-pages@v5

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # El package-lock.json se genero en Windows, asi que de los cuatro
      # paquetes que usan binario nativo (rollup, lightningcss, esbuild y
      # @tailwindcss/oxide) solo guarda la variante de Windows. El runner es
      # Linux: npm ci no trae esos binarios, y npm install tampoco, porque ve
      # el arbol como completo y no rehace nada. Por eso se anaden aparte en
      # el paso siguiente.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      # Una variante linux-x64 por cada paquete nativo, cada una en la version
      # exacta del paquete que la usa. La version se lee de su package.json
      # por ruta directa, porque algunos de estos paquetes no exponen
      # ./package.json en su campo exports y require() por nombre falla.
      # Asi el arreglo sigue valiendo cuando se actualice cualquiera de ellos.
      - name: Anadir los binarios nativos de Linux
        run: |
          npm install --no-save --no-audit --no-fund \
            "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")" \
            "lightningcss-linux-x64-gnu@$(node -p "require('./node_modules/lightningcss/package.json').version")" \
            "@esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version")" \
            "@tailwindcss/oxide-linux-x64-gnu@$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")"

      # Solo se despliega el frontend. La API en PHP y PostgreSQL viven fuera
      # de GitHub Pages, que es un hosting estatico y no ejecuta PHP ni tiene
      # base de datos. Ese despliegue es manual o vive en otro workflow.
      #
      # La API manda cuando esta desplegada. Si VITE_API_URL no esta puesta, el
      # sitio se publica igual sirviendo la foto del catalogo que hay en
      # frontend/public, asi que ya no hace falta detener el despliegue: basta
      # con avisar, porque es facil publicar por error y no enterarse.
      #
      # Se lee de las variables del repositorio (Settings > Secrets and
      # variables > Actions > Variables), no de un secret, porque su valor
      # acaba visible en el navegador y no hay que tratarlo como credencial.
      - name: Avisar si falta la URL de la API
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Sin VITE_API_URL el sitio usara la foto del catalogo."
            echo "::warning::El catalogo dejara de estar al dia hasta que se ejecute npm run catalogo."
          else
            echo "La API vive en: $VITE_API_URL"
          fi

      - name: Compilar el frontend
        run: npm run build
        env:
          # Pages sirve el sitio en /<nombre-del-repo>/, no en la raiz del
          # dominio. configure-pages devuelve esa ruta, asi que el valor se
          # calcula solo y no hay que editarlo si el repo cambia de nombre.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4

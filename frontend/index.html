<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Departamento de Desarrollo de Soluciones Tecnológicas · Estudios y Construcciones ULEAM-EP</title>
    <meta
      name="description"
      content="Portafolio del equipo de desarrollo del Departamento de Desarrollo de Soluciones Tecnológicas de Estudios y Construcciones ULEAM-EP. Proyectos, tecnologías y galería."
    />
    <meta
      name="author"
      content="Departamento de Desarrollo de Soluciones Tecnológicas · Estudios y Construcciones ULEAM-EP"
    />
    <meta name="theme-color" content="#034B88" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A4265" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Montserrat es la tipografia de todo el sitio. Se carga del CDN porque no
         hay ficheros de fuente en /public; los pesos que se piden son los que
         usa el diseno (normal, medium, semibold, bold y extrabold). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    />
    <script>
      // Aplica tema, idioma y ajustes de accesibilidad ANTES del primer pintado.
      //
      // React lee esas mismas preferencias al montar (SiteContext y
      // AccessibilityContext), pero lo hace en un useEffect, es decir despues de
      // que el navegador ya ha pintado: sin esto, una recarga en modo oscuro o
      // con texto grande daba un destello claro de la pagina entera. Aqui se
      // replican los valores por defecto, que son los mismos de
      // AccessibilityContext.jsx (A11Y_DEFAULTS).
      (function () {
        var root = document.documentElement;
        try {
          // Tema: fcvt-theme, con la preferencia del sistema como reserva.
          var theme = localStorage.getItem("fcvt-theme");
          if (theme !== "dark" && theme !== "light") {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          if (theme === "dark") root.classList.add("dark");
          root.style.colorScheme = theme;

          // Idioma: fcvt-lang
          var lang = localStorage.getItem("fcvt-lang");
          root.lang = lang === "en" ? "en" : "es";

          // Accesibilidad: fcvt-a11y (un objeto JSON con los ajustes)
          var a11y = JSON.parse(localStorage.getItem("fcvt-a11y") || "{}");
          var ATTR = {
            textSize: "text-size",
            contrast: "contrast",
            lineHeight: "line-height",
            grayscale: "grayscale",
            dyslexia: "dyslexia",
            underlineLinks: "underline-links",
            reduceMotion: "reduce-motion",
            bigCursor: "big-cursor",
          };
          var DEFAULTS = {
            textSize: "normal",
            contrast: "normal",
            lineHeight: "normal",
            grayscale: false,
            dyslexia: false,
            underlineLinks: false,
            reduceMotion: false,
            bigCursor: false,
          };
          for (var name in ATTR) {
            var value = a11y[name];
            if (value === undefined || value === DEFAULTS[name]) continue;
            root.setAttribute(
              "data-" + ATTR[name],
              typeof value === "boolean" ? "true" : String(value),
            );
          }
        } catch (e) {
          // Con las cookies bloqueadas se sigue con los valores por defecto.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
